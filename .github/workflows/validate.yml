name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  palette-and-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate palette JSON
        run: jq empty palette/oxide.json

      - name: Validate every JSON under ports/ and palette/
        run: |
          fail=0
          while IFS= read -r f; do
            if ! jq empty "$f" 2>err.log; then
              echo "::error file=$f::invalid JSON"
              cat err.log
              fail=1
            fi
          done < <(find ports palette -type f -name '*.json')
          exit $fail

      - name: Validate every TOML under ports/
        run: |
          pip install --quiet tomli
          fail=0
          while IFS= read -r f; do
            if ! python -c "import tomli, sys; tomli.loads(open('$f','rb').read().decode())" 2>err.log; then
              echo "::error file=$f::invalid TOML"
              cat err.log
              fail=1
            fi
          done < <(find ports -type f -name '*.toml')
          exit $fail

      - name: Lua syntax check (luac -p)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          fail=0
          while IFS= read -r f; do
            if ! luac5.4 -p "$f" 2>err.log; then
              echo "::error file=$f::Lua syntax error"
              cat err.log
              fail=1
            fi
          done < <(find ports -type f -name '*.lua')
          exit $fail

      - name: Lua lint (luacheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua-check
          luacheck . --globals vim

      - name: Palette drift check (every hex in ports/ ∈ palette)
        run: bash scripts/check-palette.sh

      - name: Prose check (no em-dashes, no AI-tell words)
        run: bash scripts/check-prose.sh

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec actionlint-py==1.7.12.25 actionlint
      - run: pipx run zizmor==1.30.1 --offline .github

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks over the full history
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
