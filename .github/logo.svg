<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>oxide</title>
  <rect width="200" height="200" rx="24" fill="#121113"/>
  <!-- Fanned color swatches in the palette's three accent hues + neutrals.
       Reads as a color sample, not a wordmark; primary orange dominates. -->
  <g transform="translate(100 100)">
    <!-- shadow plate -->
    <rect x="-48" y="-48" width="96" height="96" rx="14" fill="#0a0a0a"/>
    <!-- four overlapping cards, fanned -->
    <g>
      <rect x="-44" y="-44" width="76" height="76" rx="12" fill="#5f8787" transform="rotate(-12)"/>
      <rect x="-40" y="-40" width="76" height="76" rx="12" fill="#fbcb97" transform="rotate(-4)"/>
      <rect x="-36" y="-36" width="76" height="76" rx="12" fill="#c1c1c1" transform="rotate(4)"/>
      <rect x="-32" y="-32" width="76" height="76" rx="12" fill="#e78a53" transform="rotate(12)"/>
    </g>
  </g>
</svg>
